spring.application.name=ReLoop

# Local dev default: H2 in-memory - reset on every restart, zero setup
# required. For deployment, override these three via environment variables
# (Spring Boot's standard names, e.g. SPRING_DATASOURCE_URL) to point at a
# real PostgreSQL instance instead - see README.md "Deployment". No
# driverClassName is set here on purpose: Spring Boot infers the right JDBC
# driver (H2 vs PostgreSQL) from the URL's jdbc:h2:/jdbc:postgresql: prefix,
# so the same properties file works for both without an if/else.
spring.datasource.url=jdbc:h2:mem:reloopdb
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create tables from our @Entity classes on startup (fine for
# a project with no production data to preserve). Override via
# SPRING_JPA_HIBERNATE_DDL_AUTO=update (or validate) for a deployment where
# data should survive a restart.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console for inspecting tables during development.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Comma-separated origins allowed to call this API. Overridden in production
# via the RELOOP_CORS_ALLOWED_ORIGINS environment variable (see CorsConfig).
reloop.cors.allowed-origins=http://localhost:5173
